# ServiceAccount for the Prisma AIRS tag collector (Kubernetes plugin).
# Based on charts/ai-runtime-security/plugin-serviceaccount.yaml (not installed by Helm),
# with read access to serviceaccounts/namespaces and watch on nodes/endpoints added.
#
#   kubectl apply -f k8s/tag-collector-serviceaccount.yaml
#   kubectl -n kube-system get secret pan-plugin-user-secret -o json > cred.json

# Fork from https://github.com/PaloAltoNetworks/prisma-airs-helm/blob/main/cn-series-airs-helm/helm/plugin-serviceaccount.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pan-plugin-crole
rules:
- apiGroups:
  - ""
  resources:
  - endpoints
  - nodes
  - pods
  - services
  - secrets
  verbs:
  - list
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - watch
# Added for the Prisma AIRS tag collector: "Watching" stays "Initializing" and the
# plugin counters show node_cred_err / endpoint_cred_err without watch on these.
- apiGroups:
  - ""
  resources:
  - nodes
  - endpoints
  verbs:
  - get
  - watch
# Added for the Prisma AIRS tag collector: without these the Kubernetes plugin
# reports "Failed to get service accounts. Invalid permissions." (403 on
# /api/v1/serviceaccounts and /api/v1/namespaces). Read-only.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  - namespaces
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pan-plugin-crb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pan-plugin-crole
subjects:
- kind: ServiceAccount
  name: pan-plugin-user
  namespace: kube-system
---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: pan-plugin-user
  namespace: kube-system
  labels:
    app: pan-plugin
---

apiVersion: v1
kind: Secret
metadata:
  name: pan-plugin-cluster-mode-secret
  namespace: kube-system
type: Opaque
stringData:
  CLUSTER_MODE: "K8S_SERVICE"
---

apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: pan-plugin-user-secret
  annotations:
    kubernetes.io/service-account.name: "pan-plugin-user"
  namespace: kube-system
